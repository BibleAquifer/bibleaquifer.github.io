name: Deploy Redirect Site

# This site has been replaced by https://catalog.aquifer.bible.
# The only thing published now is the static redirect pages in redirect/.
# There is no scheduled build and no GitHub API access.
on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy redirect pages to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect
